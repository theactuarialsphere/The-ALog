<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flipbook Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1 id="site-title">Flipbook Library</h1>
    <p id="site-tagline"></p>
  </header>

  <main class="shelf" id="shelf"></main>

  <footer class="site-footer">Click a cover to open the flipbook.</footer>

  <script src="pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

    async function renderCover(file, holder) {
      try {
        const pdf = await pdfjsLib.getDocument(file).promise;
        const page = await pdf.getPage(1);
        const base = page.getViewport({ scale: 1 });
        const scale = (400 / base.width);
        const vp = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = vp.width;
        canvas.height = vp.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
        holder.textContent = '';
        holder.appendChild(canvas);
      } catch (e) {
        holder.textContent = 'Cover unavailable';
        console.error('Could not load', file, e);
      }
    }

    fetch('editions.json', { cache: 'no-cache' })
      .then(r => r.json())
      .then(data => {
        if (data.siteTitle) {
          document.getElementById('site-title').textContent = data.siteTitle;
          document.title = data.siteTitle;
        }
        if (data.siteTagline) document.getElementById('site-tagline').textContent = data.siteTagline;

        const shelf = document.getElementById('shelf');
        data.editions.forEach(ed => {
          const a = document.createElement('a');
          a.className = 'edition';
          a.href = 'viewer.html?ed=' + encodeURIComponent(ed.id);

          const cover = document.createElement('div');
          cover.className = 'cover';
          cover.textContent = 'Loading…';

          const h = document.createElement('h2');
          h.textContent = ed.title;

          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.textContent = [ed.subtitle, ed.date].filter(Boolean).join(' · ');

          a.append(cover, h, meta);
          shelf.appendChild(a);
          renderCover(ed.file, cover);
        });
      })
      .catch(e => {
        document.getElementById('shelf').textContent = 'Could not load editions.json — check that it is valid JSON.';
        console.error(e);
      });
  </script>
</body>
</html>
